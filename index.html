<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Single-lead ECG signal measurement">
  <title>ECG Analyzer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main>
    <header><h1>ECG Analyzer</h1><p>Single-lead ECG signal measurement</p></header>
    <section id="input-section" aria-labelledby="input-heading">
      <h2 id="input-heading">Input</h2>
      <form id="input-form" novalidate>
        <div class="input-controls">
          <input id="image-input" type="file" accept="image/*" hidden>
          <button id="choose-file" type="button">Choose file</button>
          <select id="demo-select" aria-label="Sample record"><option value="">Sample record</option></select>
          <button id="analyze-button" type="submit" disabled>Analyze</button>
        </div>
        <details id="calibration">
          <summary>Calibration</summary>
          <div class="calibration-fields">
            <label>Pixels per mm<input id="pixels-per-mm" type="number" min="0.01" step="any"></label>
            <label>Paper speed (mm/s)<input id="paper-speed" type="number" min="1" step="any" value="25"></label>
            <label>Gain (mm/mV)<input id="gain" type="number" min="0.01" step="any" value="10"></label>
            <label>Crop (left, top, right, bottom)<input id="crop-box" type="text" placeholder="automatic"></label>
            <label>Mains frequency (Hz)<select id="notch-hz"><option value="50">50</option><option value="60">60</option></select></label>
          </div>
        </details>
      </form>
    </section>
    <section id="result-section" aria-live="polite" hidden>
      <div id="result"></div>
      <div id="report-actions"><button id="download-json" type="button">Download JSON</button><button id="print-button" type="button">Print</button></div>
    </section>
  </main>
</body>
</html>
